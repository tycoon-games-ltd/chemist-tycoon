<script>
/* Kolkata Chemist Tycoon: game engine (no DOM). All numbers are imagined for play. */
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const START_CAL = 10;      // game starts in November
const START_YEAR = 2026;
const LOAN_TERM = 36;
const MAX_STORES = 5;
const SEASON = [1.06, 0.98, 0.97, 0.98, 1.00, 1.04, 1.10, 1.12, 1.08, 0.94, 0.98, 1.05];
const FIT_OUT = 300000, LICENCES = 40000, HELPER_PAY = 14000, PHARMACIST_PAY = 30000;
const UTILITIES = 8000, SOFTWARE = 1500, ACCOUNTING = 4000, DELIVERY_COST = 6000, CENTRAL = 40000;

function distKm(a, b) {
  const t = Math.PI / 180, dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function locPos(x) { if (x.lat != null) return x; const l = LOCATIONS.find(L => L.id === (x.locId || x.id)); return l || { lat: 22.57, lng: 88.39 }; }
function overlapInfo(stores, loc) {
  return stores.map(s => { const d = distKm(locPos(s), loc); return { store: s, d: d, f: d < 3 ? 1 - d / 3 : 0 }; }).filter(o => o.f > 0);
}

function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

function makeStore(loc, state, month) {
  const P = loc.potential, f = infl5(month);
  const inv = Math.round(0.27 * P);
  return {
    locId: loc.id, name: loc.name, short: loc.short, lat: loc.lat, lng: loc.lng, rent: loc.rent, potential: P, type: loc.type,
    comp: loc.comp * state.diff.comp, rep: 22, inv: inv, deposit: Math.round(4 * loc.rent * f),
    potMult: 1, helpers: 2, mods: [], temp: { d: 0, left: 0 }, noPharm: 0, pharmExtra: 0, marginMod: 0,
    shrinkExtra: 0, opened: month, avail: 1, sales: 0, profit: 0
  };
}

function setupCost(loc, month) {
  const f = infl5(month || 0), stock = Math.round(0.27 * loc.potential);
  const fit = Math.round(FIT_OUT * f), deposit = Math.round(4 * loc.rent * f), lic = Math.round(LICENCES * f);
  return { fit: fit, deposit: deposit, lic: lic, stock: stock, total: fit + deposit + lic + stock };
}

function newGame(opts, rng) {
  const diff = DIFFICULTY[opts.diff] || DIFFICULTY.normal;
  const loc = LOCATIONS.find(l => l.id === opts.locId) || LOCATIONS[0];
  const cost = setupCost(loc);
  const st = {
    v: 1, rng: rng || Math.random, diffKey: opts.diff, diff: diff, month: 0,
    savings: opts.savings, loan0: opts.loan, loan: opts.loan,
    cash: opts.savings + opts.loan - cost.total,
    stores: [], policy: Object.assign({}, DEFAULT_POLICY), history: [], payables: [],
    marginMod: 0, addons: addonState(), macro: [], followups: [], helperExtra: 0, soldFor: 0, inverter: false, cctv: false, lastEvent: {}, pending: null, over: null,
    totalDraw: 0, badges: {}, newBadges: [], last: null, inspectPass: 0, auditPass: 0,
    streaks: { stock: 0, generic: 0, monsoon: 0 }, hadLoan: opts.loan > 0, log: []
  };
  st.stores.push(makeStore(loc, st, 0));
  if (loc.type === 'jan') st.policy.generics = 100;
  return st;
}

function calIndex(month) { return (START_CAL + month) % 12; }
function calLabel(month) { const c = START_CAL + month; return MONTH_NAMES[c % 12] + ' ' + (START_YEAR + Math.floor(c / 12)); }

function simStore(st, s, p, nStores) {
  const jan = s.type === 'jan';
  const infl = Math.pow(1.05, Math.floor(st.month / 12));
  const d = jan ? 0 : p.discount / 100 + (s.temp.left > 0 ? s.temp.d : 0);
  const g = jan ? 1 : p.generics / 100;
  const priceMult = 1 + 2.0 * Math.min(d, 0.16);
  const compMult = 1 - s.comp * (1 - Math.min(1, d / 0.08));
  const repMult = 0.35 + 0.75 * s.rep / 100;
  const genMult = jan ? 1 : 1 - 0.9 * g * g;
  const markMult = 1 + 0.14 * (1 - Math.exp(-p.marketing / 9000));
  const delMult = p.delivery ? 1.08 : 1;
  let modMult = 1;
  s.mods.forEach(m => { modMult *= m.mult; });
  const pharmMult = s.noPharm > 0 ? 0.65 : 1;
  const season = SEASON[calIndex(st.month)];
  const dInfl = Math.pow(1.03, Math.floor(st.month / 12));
  let macroMult = 1;
  (st.macro || []).forEach(m => { macroMult *= (m.deliveryFix && p.delivery) ? Math.max(m.mult, 0.98) : m.mult; });
  const demand = dInfl * macroMult * s.potential * s.potMult * season * repMult * priceMult * compMult * genMult * markMult * delMult * modMult * pharmMult;
  const units = (s.noPharm > 0 ? 0.5 * s.helpers : 1 + s.helpers);
  const cap = dInfl * units * CAP_PER_PERSON * (p.delivery ? 1.08 : 1);
  const avail = Math.min(1, 0.4 + 0.6 * p.stockWeeks / 2.5);
  const afterStock = demand * avail;
  const sold = afterStock > cap ? cap + 0.35 * (afterStock - cap) : afterStock;
  const lostStock = demand * (1 - avail);
  const lostQueue = Math.max(0, afterStock - sold);
  const base = jan ? 0.20 + (sold > 500000 ? 0.02 : 0) : 0.125 * (1 - g) + 0.40 * g;
  const margin = base - d + st.marginMod + s.marginMod + (nStores >= 3 ? 0.01 : 0) + (nStores >= 5 ? 0.005 : 0);
  const gp = sold * margin;
  const expRate = 0.004 + 0.0016 * p.stockWeeks + s.shrinkExtra;
  const expiry = sold * expRate;
  const fixedRaw = s.rent + (s.noPharm > 0 ? 0 : PHARMACIST_PAY + s.pharmExtra) + s.helpers * (HELPER_PAY + (st.helperExtra || 0))
    + UTILITIES + SOFTWARE + ACCOUNTING + (p.delivery ? DELIVERY_COST : 0);
  const fixed = fixedRaw * infl + p.marketing;
  const cogs = sold - gp;
  const target = cogs * p.stockWeeks / 4.3;
  const dInv = 0.6 * (target - s.inv);
  s.inv += dInv;
  const profit = gp - expiry - fixed;
  // reputation
  let drift = 2.0 * (1 - s.rep / 105);
  if (avail < 0.95) drift -= (0.95 - avail) * 30;
  if (lostQueue > 0) drift -= Math.min(5, (lostQueue / Math.max(1, sold)) * 12);
  if (p.delivery) drift += 0.5 * (1 - s.rep / 105);
  drift += 20 * d * (1 - s.rep / 105);
  drift += Math.min(1, p.marketing / 20000) * 0.8 * (1 - s.rep / 105);
  if (s.noPharm > 0) drift -= 6;
  s.rep = clamp(s.rep + drift, 0, 100);
  s.avail = avail;
  s.mods.forEach(m => { m.left -= 1; });
  s.mods = s.mods.filter(m => m.left > 0);
  if (s.temp.left > 0) s.temp.left -= 1;
  if (s.noPharm > 0) s.noPharm -= 1;
  s.sales = sold; s.profit = profit;
  return { name: s.name, demand, sold, avail, cap, lostStock, lostQueue, margin, gp, expiry, fixed, profit, dInv, rep: s.rep,
           lostBills: Math.round((lostStock + lostQueue) / AVG_BILL), bills: Math.round(sold / AVG_BILL) };
}

function netWorth(st) {
  let nw = st.cash - st.loan;
  st.stores.forEach(s => { nw += s.inv + s.deposit; });
  return nw + addonAssets(st) + xAssets(st);
}

function runMonth(st) {
  if (st.over || st.pending) return st;
  const p = st.policy;
  const n = st.stores.length;
  const label = calLabel(st.month);
  const rows = st.stores.map(s => simStore(st, s, p, n));
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const central = n >= 2 ? (CENTRAL + 20000 * (n - 2)) * Math.pow(1.05, Math.floor(st.month / 12)) : 0;
  const interest = st.loan * LOAN_RATE / 12;
  const principal = st.loan > 0 ? Math.min(st.loan, st.loan0 / LOAN_TERM) : 0;
  st.loan -= principal;
  let due = 0;
  st.payables = st.payables.filter(x => { if (x.due <= st.month) { due += x.amount; return false; } return true; });
  const draw = Math.min(p.draw, Math.max(0, st.cash + 100000));
  const ad = addonMonth(st, rows, true);
  st.stores.forEach(s => { if (ad.rep[s.locId]) s.rep = clamp(s.rep + ad.rep[s.locId], 0, 100); });
  const xr = extrasMonth(st, rows, ad);
  const operating = sum('profit') - central + ad.gp - ad.cost + xr.gp - xr.cost;
  const cashChange = operating + xr.cash - sum('dInv') - interest - principal - due - draw;
  st.cash += cashChange;
  st.totalDraw += draw;
  const nw = netWorth(st);
  const avgRep = st.stores.reduce((a, s) => a + s.rep, 0) / n;
  const worstAvail = Math.min.apply(null, rows.map(r => r.avail));
  st.last = {
    label: label, month: st.month + 1, rows: rows, addon: ad, addonNet: ad.gp - ad.cost, sales: sum('sold') + ad.sales + xr.sales, gp: sum('gp') + ad.gp + xr.gp, expiry: sum('expiry'), extras: xr,
    fixed: sum('fixed') + ad.cost + xr.cost, central: central, operating: operating, interest: interest, principal: principal,
    payable: due, draw: draw, stockBought: sum('dInv'), cashChange: cashChange, cash: st.cash, nw: nw,
    lostBills: sum('lostBills'), lostStockBills: Math.round(sum('lostStock') / AVG_BILL), lostQueueBills: Math.round(sum('lostQueue') / AVG_BILL), bills: sum('bills'), rep: avgRep, lostSales: sum('lostStock') + sum('lostQueue')
  };
  st.history.push({ m: st.month + 1, label: label, sales: st.last.sales, gp: st.last.gp, costs: st.last.fixed + st.last.central + st.last.expiry, profit: operating, cash: st.cash, nw: nw, rep: avgRep, bills: st.last.bills, lost: st.last.lostBills, stores: n, ad: (() => { const o = {}; ad.lines.forEach(l => { o[l.id] = (o[l.id] || 0) + l.net; }); return o; })(), x: xr.gp - xr.cost });
  extrasAfter(st, operating, st.last.sales);
  // streaks for badges
  const cal = calIndex(st.month);
  st.streaks.stock = (worstAvail >= 0.98 && sum('expiry') / Math.max(1, sum('sold')) < 0.012) ? st.streaks.stock + 1 : 0;
  st.streaks.generic = (p.generics >= 40 && operating > 0) ? st.streaks.generic + 1 : 0;
  if (cal === 6) st.streaks.monsoon = 0;
  if (cal >= 6 && cal <= 8) st.streaks.monsoon = (worstAvail >= 0.95 && (cal === 6 || st.streaks.monsoon > 0)) ? st.streaks.monsoon + 1 : -99;
  st.month += 1;
  (st.macro || []).forEach(m => { m.left -= 1; });
  const ended = (st.macro || []).filter(m => m.left <= 0);
  st.macro = (st.macro || []).filter(m => m.left > 0);
  ended.forEach(m => { st.log.push({ month: st.month, title: m.name + ' is over', outcome: 'Conditions are back to normal.' });
    if (m.storm && operating > 0) unlock(st, 'storm'); });
  checkBadges(st);
  if (st.cash < -100000) st.over = 'bankrupt';
  if (!st.over) st.pending = rollEvent(st);
  return st;
}

function unlock(st, id) {
  if (!st.badges[id]) { st.badges[id] = st.month; st.newBadges.push(id); }
}

function checkBadges(st) {
  const L = st.last;
  if (L.operating > 0) unlock(st, 'black');
  if (st.month >= 12) unlock(st, 'year1');
  if (L.rep >= 50) unlock(st, 'regulars');
  if (L.rep >= 80) unlock(st, 'legend');
  if (st.streaks.stock >= 6) unlock(st, 'stock');
  if (st.streaks.monsoon >= 3) unlock(st, 'monsoon');
  if (st.streaks.generic >= 6) unlock(st, 'generic');
  if (st.hadLoan && st.loan < 1) unlock(st, 'debt');
  if (st.stores.length >= 2) unlock(st, 'two');
  if (st.stores.length >= 3) unlock(st, 'three');
  if (st.stores.length >= 5) unlock(st, 'five');
  const A = st.addons;
  if (Object.keys(A.doctor).some(k => A.doctor[k].stage === 'live')) unlock(st, 'doc');
  if (Object.keys(A.lab).length) unlock(st, 'lab');
  if (A.app && A.app.stage === 'live') unlock(st, 'app');
  if (A.club && A.club.members >= 100) unlock(st, 'club');
  if (A.app && A.club && Object.keys(A.doctor).length && Object.keys(A.lab).length && Object.keys(A.well).length && Object.keys(A.rent).some(k => A.rent[k].last && A.rent[k].last.total > 0)) unlock(st, 'full');
  if (st.month >= 36) unlock(st, 'finish');
  if (st.month >= 60) unlock(st, 'year5');
  if (st.month >= 120) unlock(st, 'decade');
  if (L.nw >= 10000000) unlock(st, 'crore');
  if (L.nw >= 2000000) unlock(st, 'twenty');
  if (st.auditPass > 0) unlock(st, 'audit');
  if (st.history) { checkNewBadges(st); goalsTick(st); }
}

function expansionInfo(st) {
  if (st.stores.length >= MAX_STORES) return { ok: false, reason: 'Five stores is the limit.' };
  if (st.month < 9) return { ok: false, reason: 'Open a second store after month 9, once the first one has settled.' };
  return { ok: true };
}

function openStore(st, locId) {
  const info = expansionInfo(st);
  if (!info.ok) return { ok: false, reason: info.reason };
  const loc = LOCATIONS.find(l => l.id === locId);
  if (!loc) return { ok: false, reason: 'Pick a location.' };
  if (st.stores.some(s => s.locId === loc.id)) return { ok: false, reason: 'You already trade from there.' };
  const c = setupCost(loc, st.month);
  if (st.cash - c.total < 100000) return { ok: false, reason: 'You need at least ₹1 lakh left in cash after setup.' };
  st.cash -= c.total;
  const s = makeStore(loc, st, st.month);
  const ov = overlapInfo(st.stores, loc);
  ov.forEach(o => { s.potMult *= 1 - 0.25 * o.f; o.store.potMult *= 1 - 0.12 * o.f; });
  st.stores.push(s);
  checkBadges(st.last ? st : Object.assign(st, { last: { operating: 0, rep: 0, nw: 0 } }));
  return { ok: true, cost: c.total, overlap: ov.map(o => ({ name: o.store.short, km: o.d, mine: Math.round(25 * o.f), theirs: Math.round(12 * o.f) })) };
}

function addMacro(st, name, mult, left, extra) { st.macro.push(Object.assign({ name: name, mult: mult, left: left }, extra || {})); }
function later(st, id, months, s) { st.followups.push({ id: id, month: st.month + months, storeIndex: st.stores.indexOf(s) }); }

/* ---- shocks and cross add on realism ---- */
function addonShock(st, kind) {
  const A = st.addons, infl = Math.pow(1.05, Math.floor(st.month / 12)), msg = [];
  if (!A) return '';
  if (kind === 'power' && !st.inverter) {
    Object.keys(A.vax || {}).forEach(k => { if (!A.vax[k].backup) { st.cash -= 40000 * infl; A.vax[k].spoiledAt = st.month; msg.push('The vaccine fridge lost a batch (' + inr(40000 * infl) + ').'); } });
    Object.keys(A.lab || {}).forEach(k => { if (A.lab[k].mode === 'own') { A.lab[k].down = Math.max(A.lab[k].down || 0, 1); msg.push('The lab analyser tripped and needs a restart day.'); } });
  }
  if (kind === 'flood') {
    Object.keys(A.vax || {}).forEach(k => { if (!A.vax[k].backup && !st.inverter) { st.cash -= 40000 * infl; A.vax[k].spoiledAt = st.month; msg.push('Floodwater spoiled the vaccine stock (' + inr(40000 * infl) + ').'); } });
    Object.keys(A.rent || {}).forEach(k => { Object.keys(A.rent[k].units).forEach(it => { const lost = Math.ceil(A.rent[k].units[it] * 0.2); if (A.rent[k].units[it] > 0) { A.rent[k].units[it] -= lost; msg.push(lost + ' rented ' + RENT_ITEMS[it].name.toLowerCase() + ' lost to the water.'); } }); });
    if (A.app && A.app.stage === 'live') { A.app.pause = Math.max(A.app.pause || 0, 1); msg.push('Riders could not ride, so the app paused for a month.'); }
  }
  if (kind === 'lockdown') {
    if (A.app && A.app.stage === 'live') msg.push('Your app is busy with stay at home orders.');
    if (Object.keys(A.nurse || {}).length) msg.push('Home nursing requests are climbing.');
  }
  return msg.length ? ' ' + msg.join(' ') : '';
}

function rollEvent(st) {
  if (st.noEvents) return null;
  const fi = st.followups.findIndex(f => f.month <= st.month);
  if (fi >= 0) {
    const f = st.followups.splice(fi, 1)[0];
    const fe = FOLLOWUPS[f.id];
    if (fe) { const store = st.stores[Math.min(f.storeIndex || 0, st.stores.length - 1)];
      const ev = fe(st, store); ev.id = f.id; ev.storeIndex = st.stores.indexOf(store); return ev; }
  }
  const fx = forcedEvent(st); if (fx) return fx;
  if (st.month < 2 || st.rng() > 0.66) return null;
  const pool = EVENTS.filter(e => st.month >= e.min && (st.lastEvent[e.id] === undefined || st.month - st.lastEvent[e.id] >= e.cool) && e.cond(st));
  if (!pool.length) return null;
  const w = pool.map(e => e.weight * (e.neg ? st.diff.bad : 1));
  let r = st.rng() * w.reduce((a, b) => a + b, 0), chosen = pool[0];
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { chosen = pool[i]; break; } }
  st.lastEvent[chosen.id] = st.month;
  const store = pick(st.stores, st.rng);
  const sIdx = st.stores.indexOf(store);
  const ev = chosen.make(st, store);
  ev.id = chosen.id; ev.storeIndex = sIdx;
  if (ev.target) { const ti = st.stores.findIndex(x => x.locId === ev.target); if (ti >= 0) ev.storeIndex = ti; }
  return ev;
}

function resolveEvent(st, choiceIndex) {
  if (!st.pending) return '';
  const ev = st.pending;
  const store = st.stores[ev.storeIndex] || st.stores[0];
  const out = ev.choices[choiceIndex].run(st, store);
  st.pending = null;
  st.log.push({ month: st.month, title: ev.title, outcome: out });
  if (st.cash < -100000 && !st.over) st.over = 'bankrupt';
  checkBadges(st.last ? st : Object.assign(st, { last: { operating: 0, rep: 0, nw: 0, rows: [] } }));
  return out;
}

function advice(st) {
  const tips = [];
  const L = st.last;
  if (!L) return ['Set your policy, then run your first month. Stock, staff and price all move your reputation.'];
  const worst = L.rows.reduce((a, r) => (r.avail < a.avail ? r : a), L.rows[0]);
  if (worst.avail < 0.95) tips.push('Stockouts cost about ' + inr(worst.lostStock) + ' in sales at ' + worst.name + '. Raise stock cover toward 2.5 weeks or more.');
  const over = L.rows.reduce((a, r) => (r.lostQueue > a.lostQueue ? r : a), L.rows[0]);
  if (over.lostQueue > 15000) tips.push('The queue was too long at ' + over.name + ', losing about ' + inr(over.lostQueue) + '. Hire another helper.');
  const monthlyFixed = L.fixed + L.central;
  if (st.cash < 1.5 * monthlyFixed) tips.push('Cash is under two months of running costs. Trim marketing, owner draw or stock cover.');
  if (st.policy.generics > 55 && st.stores[0].type !== 'jan') tips.push('Above about 55% generics, walk in customers who want their usual brand start to leave.');
  if (st.policy.discount >= 6 && st.stores.every(s => s.comp < 0.2)) tips.push('A ' + st.policy.discount + '% discount is expensive where competition is mild. Try trimming it.');
  if (st.policy.stockWeeks > 5) tips.push('Stock cover of ' + st.policy.stockWeeks + ' weeks ties up cash and raises expiry losses.');
  if (L.operating < 0 && st.month > 10) tips.push('Still running at a loss after the first year. Revisit staff count and rent versus sales.');
  if (!tips.length) tips.push('Nothing urgent. Keep reputation climbing, it is what lifts sales over time.');
  return tips.slice(0, 3);
}

function finalScore(st) {
  const nw = st.over === 'sold' ? st.soldFor : netWorth(st);
  const wealth = nw + st.totalDraw - st.savings;
  let stars = wealth < -300000 ? 1 : wealth < 300000 ? 2 : wealth < 1000000 ? 3 : wealth < 2000000 ? 4 : 5;
  let title;
  if (st.over === 'bankrupt') { stars = 1; title = 'Shutters down'; }
  else if (wealth < -300000) title = 'The expensive lesson';
  else if (wealth < 300000) title = 'Still standing';
  else if (wealth < 1000000) title = 'Neighbourhood favourite';
  else if (wealth < 2000000) title = 'Pharmacy baron';
  else if (wealth < 10000000) title = 'Chemist of the year';
  else title = 'Pharma mogul';
  return { nw: nw, wealth: wealth, stars: stars, title: title, months: st.month };
}

    var c=JSON.parse(JSON.stringify(G,function(k,v){return(k==='rng'||k==='pending')?undefined:v;}));
    var n=c.stores.length,sales=0,profit=0;

  var ta=d.querySelector('#icode'),go=d.querySelector('#igo'),er=d.querySelector('#ierr'),pv=d.querySelector('#iprev'),cur=null;
  function check(){
    cur=null;go.disabled=true;er.hidden=true;pv.innerHTML='';
    if(!ta.value.trim())return;
    var r=readCode(ta.value);
    if(r.err){er.textContent=r.err;er.hidden=false;return;}
    cur=r.g;go.disabled=false;
    pv.innerHTML='<div class="opt on" style="cursor:default"><b>'+esc(cur.stores.map(function(s){return s.short||s.name;}).join(' + '))+'</b><br><span class="small mute">'+calLabel(cur.month)+' · year '+(Math.floor(cur.month/12)+1)+' · net worth '+fmt(netWorth(cur))+'</span></div>';
  }
  ta.oninput=check;ta.onpaste=function(){setTimeout(check,30);};
  d.querySelector('#ifile').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>6e6){er.textContent='That file is too large.';er.hidden=false;return;}var fr=new FileReader();fr.onload=function(){ta.value=String(fr.result||'');check();};fr.readAsText(f);};
  d.querySelector('#ix').onclick=function(){d.remove();};
  go.onclick=function(){if(!cur)return;d.remove();startFromData(cur);};
  setTimeout(function(){ta.focus();},50);
}

var SC_LOCK={hospital:'beliaghata',generics:'jan'};
function setupFin(s){var d=DIFFICULTY[s.diff],sc=s.scenario||'classic';if(sc==='rescue')return {sv:450000,loan:900000};if(sc==='hospital')return {sv:Math.max(d.savings,3200000),loan:s.loan};if(sc==='generics')return {sv:800000,loan:0};return {sv:d.savings,loan:s.loan};}

var chartN=0;
function lineChart(series,w,hgt){
  if(series.length<2)return '<p class="hint">Run a couple of months to see the chart.</p>';
  var min=Math.min.apply(null,series.map(function(s){return s.v;})),max=Math.max.apply(null,series.map(function(s){return s.v;}));
  if(min===max){max=min+1;}
  var pad=6,pts=series.map(function(s,i){var x=pad+(w-2*pad)*i/(series.length-1);var y=hgt-pad-(hgt-2*pad)*(s.v-min)/(max-min);return x.toFixed(1)+','+y.toFixed(1);});
  var zero=(min<0&&max>0)?hgt-pad-(hgt-2*pad)*(0-min)/(max-min):null;
  var gid='ga'+(++chartN);return '<svg viewBox="0 0 '+w+' '+hgt+'" role="img" aria-label="trend chart" width="100%"><defs><linearGradient id="'+gid+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs><polygon class="areaf" fill="url(#'+gid+')" points="'+pad+','+(hgt-pad)+' '+pts.join(' ')+' '+(w-pad)+','+(hgt-pad)+'"/><polyline class="draw" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(' ')+'"/>'+(zero!==null?'<line x1="0" x2="'+w+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--mute)" stroke-dasharray="4 4"/>':'')+'</svg><div class="row between small mute"><span>'+fmt(min)+'</span><span>'+fmt(max)+'</span></div>';
}

  function fb(){var d=modal('<h3>Select all and copy</h3><textarea id="csvt" style="width:100%;height:200px;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px"></textarea><button class="big" id="csvx">Done</button>');var t=d.querySelector('#csvt');t.value=txt;t.focus();t.select();d.querySelector('#csvx').onclick=function(){d.remove();};}
  try{navigator.clipboard.writeText(txt).then(function(){toast('Copied '+rows.length+' months');},fb);}catch(e){fb();}
}
function lostWhy(L){var a=L.lostStockBills||0,b=L.lostQueueBills||0;if(a>=b&&a>0)return a+' were empty shelves: raise stock cover.';if(b>0)return b+' were queues: add helpers at the busy shop.';return '';}
function runN(n){
  if(!G||G.over||G.pending||summaryOpen)return;
  uiNote=null;var snaps=[];undoSnap=serializeG(G);
  for(var i=0;i<n;i++){runMonth(G);snaps.push(G.last);if(G.over||G.pending)break;}
  var nbs=G.newBadges.splice(0);
  if(G.history.length>0&&G.history.length%12===0)setTimeout(function(){toast('Year '+(G.history.length/12)+' in review is ready in Report');},1600);
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
  if(reduced){showSummary(snaps,nbs);return;}
  summaryOpen=true;
  var first=snaps[0].label,last=snaps[snaps.length-1].label;
  var t=document.createElement('div');t.className='turn';t.innerHTML='<div class="leaf"><small>'+(snaps.length>1?'Closing the books':'Closing the month')+'</small><b>'+(snaps.length>1?first+' to '+last:first)+'</b></div>';
  document.body.appendChild(t);
  setTimeout(function(){t.remove();summaryOpen=false;showSummary(snaps,nbs);},720);
}
function explain(){
  var L=G.last,h=G.history,prev=h.length>1?h[h.length-2]:null,out=[],jan=G.stores.every(function(s){return s.type==='jan';});
  if(!prev){out.push(['','Month one: reputation starts low and grows with every month you serve well.']);}
  else{
    var pct=(L.sales/Math.max(1,prev.sales)-1)*100;
    if(Math.abs(pct)>=3){
      var cal=calIndex(G.month-1),pcal=calIndex(G.month-2);
      var c=[{v:(SEASON[cal]/SEASON[pcal]-1)*100,t:'the season'},{v:((0.35+0.75*L.rep/100)/(0.35+0.75*prev.rep/100)-1)*100,t:'reputation moving '+Math.round(prev.rep)+' to '+Math.round(L.rep)}];
      (G.macro||[]).forEach(function(m){if(Math.abs(m.mult-1)>0.03)c.push({v:(m.mult-1)*100,t:m.name.toLowerCase()});});
      c.sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v);});
      out.push([pct<0?'warn':'','Sales '+(pct>0?'up ':'down ')+Math.abs(Math.round(pct))+'%, mostly '+c[0].t+'.']);
    }
  }
  if(L.addon&&L.addon.lines.length){var an=L.addonNet||0;var best=L.addon.lines.slice().sort(function(a,b){return Math.abs(b.net)-Math.abs(a.net);})[0];if(best&&best.net!==0)out.push([an<0?'warn':'','Add ons netted '+(an>=0?'+':'')+fmt(an)+'. Biggest: '+best.label.toLowerCase()+' '+(best.net>=0?'+':'')+fmt(best.net)+'.']);}
  if(L.lostBills>20)out.push(['bad',L.lostBills+' bills walked away. '+lostWhy(L)]);
  if(L.sales>0&&L.expiry/L.sales>0.012)out.push(['warn','Expiry cost '+fmt(L.expiry)+'. Trim stock cover a little.']);
  if(!jan&&G.policy.discount>=6)out.push(['warn','Discounts cost about '+fmt(L.sales*G.policy.discount/100)+' of margin.']);
  out.push(L.operating<0?['bad','Costs of '+fmt(L.fixed+L.central+L.expiry)+' beat gross profit of '+fmt(L.gp)+'.']:['','Gross margin '+(L.sales?(L.gp/L.sales*100).toFixed(0):0)+'%'+(jan?'.':' with '+G.policy.generics+'% generics.')]);
  return out.slice(0,3);
}
function whyHtml(){return '<ul class="why">'+explain().map(function(x,i){return '<li class="'+x[0]+'" style="animation-delay:'+(0.5+i*0.12)+'s">'+esc(x[1])+'</li>';}).join('')+'</ul>';}
function showSummary(snaps,nb){
  summaryOpen=true;
  var one=snaps.length===1,L=snaps[snaps.length-1],tot=snaps.reduce(function(a,x){return a+x.operating;},0);
  var h='<div class="row between"><h2>'+(one?L.label:snaps[0].label+' to '+L.label)+'</h2><span class="tag">'+snaps.length+' month'+(one?'':'s')+'</span></div>';
  h+='<div><div class="small mute">'+(one?'Operating profit':'Total operating profit')+'</div><div class="big-num '+cls(tot)+'">'+fmt(tot)+'</div></div>';
  if(one){h+='<table><tr><td>Sales ('+L.bills+' bills)</td><td>'+fmt(L.sales)+'</td></tr><tr><td>Change in cash</td><td class="'+cls(L.cashChange)+'">'+fmt(L.cashChange)+'</td></tr><tr><td>Reputation</td><td>'+Math.round(L.rep)+'</td></tr><tr><td>Cash now</td><td>'+fmt(L.cash)+'</td></tr></table>';
    }
  else h+='<table>'+snaps.map(function(x){return '<tr><td>'+x.label+'</td><td class="'+cls(x.operating)+'">'+fmt(x.operating)+'</td></tr>';}).join('')+'<tr><td><b>Cash now</b></td><td><b>'+fmt(L.cash)+'</b></td></tr></table>';
  if(!G.over&&Math.floor((G.month)/12)>Math.floor((snaps[0].month-1)/12)&&G.month%12<snaps.length)h+='<div class="msg ok">A new year begins. Rents and wages rise about 5%, prices and demand about 3%.</div>';
  if(nb.length)h+='<div class="chips">'+nb.map(function(id){return '<span class="tag" style="background:var(--gold);color:#2b1d00">Badge: '+esc(BADGES.find(function(b){return b.id===id;}).name)+'</span>';}).join('')+'</div>';
  h+='<div><div class="small mute" style="margin-bottom:6px">Why it happened</div>'+whyHtml()+'</div>';
  h+='<button class="big" id="cont2">'+(G.over?'See final result':G.pending?'Something came up':'Continue')+'</button>';
  var d=modal(h);var bn=d.querySelector('.big-num');if(bn)countUp(bn,tot);if(nb.length||(!G.over&&G.month%12===0&&G.month>0))confetti(nb.length?60:36);d.querySelector('#cont2').onclick=function(){d.remove();summaryOpen=false;tab='run';render();window.scrollTo(0,0);};
}
function showHelp(){
  var K='<style>@keyframes knob{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}@keyframes grow{from{transform:scaleY(.25)}to{transform:scaleY(1)}}@keyframes flipx{0%,40%{transform:rotateX(0)}50%{transform:rotateX(90deg)}60%,100%{transform:rotateX(0)}}</style>';
  var steps=[
    {t:'Set your policy',d:'Sliders control price, stock and staff. Tap i for what each one does.',
     s:'<svg viewBox="0 0 160 64">'+[12,32,52].map(function(y,k){return '<rect x="10" y="'+(y-2)+'" width="140" height="4" rx="2" style="fill:var(--line)"/><circle cx="26" cy="'+y+'" r="6" style="fill:var(--accent);animation:knob '+(2+k*.5)+'s ease-in-out infinite"/>';}).join('')+'</svg>'},
    {t:'Watch the forecast',d:'The bar at the bottom predicts sales and profit as you slide.',
     s:'<svg viewBox="0 0 160 64">'+[0,1,2,3,4,5].map(function(k){var hh=[20,32,26,44,38,52][k];return '<rect x="'+(18+k*22)+'" y="'+(60-hh)+'" width="14" height="'+hh+'" rx="3" style="fill:var(--accent);transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s ease-in-out '+(k*.12)+'s infinite alternate"/>';}).join('')+'</svg>'},
    {t:'Run the month',d:'Press Run. A short summary shows what happened and why.',
     s:'<svg viewBox="0 0 160 64"><g style="transform-box:fill-box;transform-origin:50% 0;animation:flipx 2.2s ease-in-out infinite"><rect x="50" y="6" width="60" height="50" rx="8" style="fill:var(--card);stroke:var(--accent)" stroke-width="2"/><rect x="50" y="6" width="60" height="14" rx="6" style="fill:var(--accent)"/><text x="80" y="42" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--fg)" font-family="Bricolage Grotesque,serif">Nov</text></g></svg>'},
    {t:'Handle surprises',d:'Events ask you to choose, and some come back months later. Retire or sell whenever you like.',
     s:'<svg viewBox="0 0 160 64"><g style="animation:rise 1s ease-out infinite alternate"><rect x="28" y="6" width="104" height="52" rx="8" style="fill:var(--card);stroke:var(--warn)" stroke-width="2"/><rect x="38" y="14" width="60" height="5" rx="2" style="fill:var(--warn)"/><rect x="38" y="26" width="84" height="12" rx="4" style="fill:var(--soft)"/><rect x="38" y="42" width="84" height="12" rx="4" style="fill:var(--soft)"/></g></svg>'}
  ],i=0;
  var d=modal('<div class="coach" id="coach"></div>');
  function draw(){var s=steps[i],last=i===steps.length-1;
    d.querySelector('#coach').innerHTML=K+s.s+'<h2 style="margin:8px 0 4px">'+s.t+'</h2><p style="margin:0;min-height:44px" class="mute">'+s.d+'</p><div class="dots" style="margin:12px 0">'+steps.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>';}).join('')+'</div><div class="row"><button class="ghost" id="hs" style="flex:1">Skip</button><button id="hn" style="flex:2">'+(last?'Start playing':'Next')+'</button></div>';
    d.querySelector('#hs').onclick=function(){d.remove();};
    d.querySelector('#hn').onclick=function(){if(last)d.remove();else{i++;draw();}};
  }
  draw();
}
document.getElementById('run').onclick=function(){runN(1);};
document.getElementById('run3').onclick=function(){runN(3);};
function modal(inner){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="sheet">'+inner+'</div>';document.body.appendChild(d);return d;}
function showEvent(){
  if(document.querySelector('.modal'))return;
  var ev=G.pending;buzz();
  var d=modal('<span class="tag w">'+esc(G.stores[ev.storeIndex]?G.stores[ev.storeIndex].name:'')+'</span><h2>'+esc(ev.title)+'</h2><p style="margin:0">'+esc(ev.text)+'</p>'+ev.choices.map(function(c,i){return '<button class="opt" data-c="'+i+'" style="animation-delay:'+(0.1+i*0.09)+'s"><b>'+esc(c.label)+'</b><br><span class="small mute">'+esc(c.desc)+'</span></button>';}).join(''));
  d.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){var out=resolveEvent(G,+b.dataset.c);d.remove();var nb=G.newBadges.splice(0);if(nb.length)toast('Badge unlocked');uiNote=out;tab='run';render();window.scrollTo(0,0);};});
}
function showQuit(){
  var nw=netWorth(G);
  var d=modal('<h2>Game menu</h2><p class="mute" style="margin:0">You can keep trading for as long as you like. Retiring ends the game and scores your net worth of '+fmt(nw)+'.</p><button class="soft big" id="q4">How to play</button><button class="big" id="q3">Retire and cash out</button><button class="ghost big" id="q1">Abandon this run</button><button class="soft big" id="q2">Keep playing</button>');
  d.querySelector('#q2').onclick=function(){d.remove();};
  d.querySelector('#q4').onclick=function(){d.remove();showHelp();};
  d.querySelector('#q3').onclick=function(){d.remove();retire(G);render();window.scrollTo(0,0);};
  d.querySelector('#q1').onclick=function(){d.remove();try{localStorage.removeItem('ct_save');}catch(e){}G=null;render();};
}

/* ---------- End ---------- */
function renderEnd(){
  $app.className='endscr';
  try{localStorage.removeItem('ct_save');}catch(e){}
  var f=finalScore(G), won=G.over!=='bankrupt';
  var gain=f.wealth;
  try{if(gain>best){best=gain;localStorage.setItem('ct_best',String(gain));}}catch(e){}
  var star='';for(var i=0;i<5;i++)star+='<span style="animation-delay:'+(0.25+i*0.18)+'s">'+(i<f.stars?'★':'☆')+'</span>';
  var h='<div class="card" style="text-align:center"><div class="small mute">'+(G.over==='sold'?'Sold after ':G.over==='retired'?'Retired after ':'Out of cash after ')+Math.floor(G.month/12)+' years '+(G.month%12)+' months'+'</div><h1 style="margin:6px 0">'+f.title+'</h1><div class="stars" aria-label="'+f.stars+' of 5 stars">'+star+'</div>'+
  '<table style="margin-top:10px;text-align:left"><tr><td>'+(G.over==='sold'?'Sale price':'Final net worth')+'</td><td>'+fmt(f.nw)+'</td></tr><tr><td>Owner draws taken</td><td>'+fmt(G.totalDraw)+'</td></tr><tr><td>Starting savings</td><td>-'+fmt(G.savings)+'</td></tr><tr><td><b>Net gain</b></td><td class="'+cls(gain)+'"><b>'+fmt(gain)+'</b></td></tr></table></div>';
  h+='<div class="card"><h3>How that compares</h3><p class="small mute" style="margin:6px 0 8px">The spreadsheet model for one shop gave a break even around month 14 to 24 depending on the case. In your final month:</p>'+(G.last?'<table><tr><td>Monthly sales</td><td>'+fmt(G.last.sales)+'</td></tr><tr><td>Operating profit</td><td class="'+cls(G.last.operating)+'">'+fmt(G.last.operating)+'</td></tr><tr><td>Stores</td><td>'+G.stores.length+'</td></tr></table>':'')+'<p class="small mute" style="margin:8px 0 0">Reference points: weak case ₹6 lakh a month, base ₹9 lakh, strong ₹13 lakh at steady state.</p></div>';
  h+='<div class="card"><h3>Net worth over time</h3>'+lineChart(G.history.map(function(x){return{v:x.nw};}),320,110)+'</div>';
  h+='<div class="card"><div class="row between"><h3>Badges</h3><span class="tag">'+Object.keys(G.badges).length+' of '+BADGES.length+'</span></div><div class="chips" style="margin-top:8px">'+BADGES.map(function(b){return '<span class="tag'+(G.badges[b.id]?'':' w')+'" style="opacity:'+(G.badges[b.id]?1:.45)+'">'+esc(b.name)+'</span>';}).join('')+'</div></div>';
  h+=scoreBlock().replace('<details class="sec" data-sec="score"','<details class="sec" data-sec="score" open');
  h+='<button class="big" id="again">Play again</button>';
  $app.innerHTML=h;
  if(f.stars>=4||G.over==='sold')setTimeout(function(){confetti(80);},700);
  wireScore();
  document.getElementById('again').onclick=function(){G=null;screen='title';render();window.scrollTo(0,0);};
}
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='Escape'){var mdl=document.querySelectorAll('.modal');if(mdl.length&&!G||mdl.length&&!(G&&G.pending)){mdl[mdl.length-1].remove();}return;}
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||document.querySelector('.modal')||!G||G.over)return;
  var k=e.key.toLowerCase(),map={'1':'run','2':'report','3':'grow','4':'manage','5':'badges'};
  if(map[k]){tab=map[k];view=null;mapOpen=false;uiNote=null;render();window.scrollTo(0,0);}
  else if(k==='r'){var b=document.getElementById('run');if(b&&!b.disabled)b.click();}
  else if(k==='t'){var b3=document.getElementById('run3');if(b3&&!b3.disabled)b3.click();}
  else if(k==='m'){gameMenu();}
});
loadSet();render();
})();
